name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.8"
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (no heavy deps)
        run: |
          pip install --upgrade pip
          # Type-check without pulling torch/lerobot to keep CI fast.
          # Library code is type-clean against its declared interfaces.
          pip install "mypy>=1.13" "numpy>=2.0" "scipy>=1.13" "pandas-stubs" "types-tqdm" "types-PyYAML"
      - name: Mypy
        run: mypy src

  liveness:
    name: liveness-claim linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on liveness claims about unreleased artifacts
        run: |
          set -euo pipefail
          pattern='live leaderboard|live dashboard|dataset is live|published dataset|pull the published'
          allow_re=$(grep -v '^#' .github/liveness-allowlist.txt | sed '/^[[:space:]]*$/d' | paste -sd'|')
          hits=$(grep -rniE "$pattern" README.md docs site | grep -vE "^($allow_re):" || true)
          if [ -n "$hits" ]; then
            echo "Liveness claim about an unreleased artifact. Rephrase as release-pending,"
            echo "or allowlist the file with a reason in .github/liveness-allowlist.txt:"
            echo "$hits"
            exit 1
          fi

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lychee (annotated ignore-list at .lycheeignore)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-all-private README.md 'docs/**/*.md' 'site/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: pytest (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with dev extras (no sim, no GPU)
        run: |
          set -euo pipefail
          pip install --upgrade pip
          # CI installs lightweight deps only; sim/gpu tests are excluded
          # via pytest marks. Real benchmark work runs on the dev box.
          # Fail loudly on a broken dependency tree — no silent --no-deps fallback.
          pip install -e ".[dev]"
      - name: Run fast tests with coverage
        # Coverage floor is 82%. Measured 86% on main (2026-05-22, dev-extras
        # install — sim-marked tests skip identically here). Floor sits a few
        # points below so it ratchets against regressions without breaking on
        # normal churn; raise it when measured coverage climbs durably.
        run: |
          pytest -m "not slow and not gpu and not sim" \
            --cov=embodimetry \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=82
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
