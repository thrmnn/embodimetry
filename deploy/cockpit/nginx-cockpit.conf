# Cockpit static host — loopback-only; TLS + tailnet-only access come from
# `tailscale serve --https=8443 -> http://127.0.0.1:8080` on the VPS.
# Root is a plain dir rsynced by the laptop (scripts/push_cockpit.sh):
# no release dirs, no symlinks.
server {
    listen 127.0.0.1:8080;
    root /srv/cockpit/current;
    index index.html;
    autoindex off;
    # keep redirects relative: nginx only knows the loopback origin, the real
    # origin is the tailscale-serve https://…:8443 front
    absolute_redirect off;

    location = / {
        return 302 /_hub/;
    }

    # rsync preserves mtimes: without no-cache Chrome's heuristic freshness
    # would serve weeks-old pages as fresh, defeating network-first. This
    # prefix location covers all html, directory indexes, build.json and
    # fleet_status.json; the asset regex below carves out cacheable statics.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|svg|jpg|css|js|pdf|ipynb)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # stock mime.types lacks webmanifest; application/octet-stream silently
    # breaks Chrome PWA installability.
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
